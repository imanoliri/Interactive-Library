name: Knowledge validation

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "scripts/validate_knowledge.py"
      - ".github/workflows/knowledge-validation.yml"
  push:
    branches:
      - main
    paths:
      - "knowledge/**"
      - "scripts/validate_knowledge.py"

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - run: python scripts/validate_knowledge.py
